name: Validate Commons packages and isolated consumer
description: Pack existing Release outputs, validate payloads and symbols, and compile a package-only consumer.
runs:
  using: composite
  steps:
    - name: Validate package outputs and consumption
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/commons-packages"
        python3 scripts/pack-release-packages.py "$RUNNER_TEMP/commons-packages" 0.0.0
        python3 scripts/validate-nuget-packages.py "$RUNNER_TEMP/commons-packages"
        python3 scripts/validate-consumer-package-references.py "$RUNNER_TEMP/commons-packages"
