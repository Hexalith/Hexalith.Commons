name: Release

# Publication is an explicit operator action. The unprotected preflight proves
# the dispatch selected the current main tip and that exact source already has
# a successful push CI run before the protected release environment is entered.
on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify exact green main source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require current main with successful exact-source CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Release must be dispatched from refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The dispatch source must be an exact lowercase commit SHA." >&2
            exit 1
          fi

          live_main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$live_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The live main SHA could not be resolved safely." >&2
            exit 1
          fi
          if [ "$DISPATCH_SHA" != "$live_main_sha" ]; then
            echo "The dispatched source is no longer the live main tip." >&2
            exit 1
          fi

          ci_runs="$(gh api --method GET \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$DISPATCH_SHA" \
            -f status=success \
            -f per_page=100)"
          if ! printf '%s\n' "$ci_runs" | jq -e --arg sha "$DISPATCH_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )] | length > 0
          ' >/dev/null; then
            echo "No successful push CI run exists for the exact current main SHA." >&2
            exit 1
          fi

  release:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      # Authentication stays in this job so NuGet sees release.yml in this repository.
      - name: Prepare release
        id: prepare
        uses: Hexalith/Hexalith.Builds/Github/prepare-domain-release@aeb57b3177c4e8b3dd3929a6308a4c576b297d9e
        with:
          solution: Hexalith.Commons.slnx
          builds-execution-sha: aeb57b3177c4e8b3dd3929a6308a4c576b297d9e
          expected-package-count: 12
          publication-flag: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}
          nuget-user: ${{ vars.NUGET_USER }}
          packages-lock-file: Directory.Packages.props, global.json, references/Hexalith.Builds/Props/Directory.Packages.props
      - name: Authenticate to NuGet with trusted publishing
        if: ${{ steps.prepare.outputs.publish-enabled == 'true' }}
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Semantic Release
        if: ${{ steps.prepare.outputs.publish-enabled == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: npm exec --no -- semantic-release
      - name: Verify GitHub release and every NuGet package download
        if: ${{ steps.prepare.outputs.publish-enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --exact-match HEAD)"
          gh release view "$tag" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease' | grep -qx false
          python3 tools/verify_nuget_release.py "${tag#v}" --commit "$RELEASE_SOURCE"
      - name: Preserve packages for release recovery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: nupkgs/*.*nupkg
          if-no-files-found: ignore
          retention-days: 14
